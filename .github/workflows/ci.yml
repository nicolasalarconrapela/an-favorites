name: CI

on:
  push:
    branches: [ main, develop, release/*, releases/* ]
  pull_request:
    branches: [ main, develop, release/*, releases/* ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install system dependencies for VS Code
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libgtk-3-0 \
          libxss1 \
          libasound2t64 \
          libnss3 \
          libxkbfile1 \
          libsecret-1-0

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint --if-present

    - name: Compile
      run: npm run compile

    - name: Run unit tests
      run: npm run test:unit --if-present

    - name: Run integration tests
      run: xvfb-run -a npm run test:integration

    - name: Package extension
      run: npm run package

    - name: Validate VSIX artifact
      run: |
        if ! compgen -G "*.vsix" > /dev/null; then
          echo "No se generó ningún fichero .vsix"
          exit 1
        fi
        ls -lh ./*.vsix
        npm run validate:vsix -- "$(ls -t ./*.vsix | head -n 1)"
